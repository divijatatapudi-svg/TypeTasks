<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A calm, clear space to keep your tasks moving."
    />
    <title>TaskNest — Make room for what matters</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="TaskNest home">
          <span class="brand-mark" aria-hidden="true">t</span>
          <span>TaskNest</span>
        </a>
        <span class="topbar-note">A little more focus, every day</span>
      </header>

      <section class="workspace" aria-labelledby="page-title">
        <div class="intro">
          <p class="eyebrow">YOUR SPACE TO GET THINGS DONE</p>
          <h1 id="page-title">Make room for <span>what matters.</span></h1>
          <p class="subtitle">
            Gather your thoughts, find your next step, and let the rest feel lighter.
          </p>
        </div>

        <section class="task-panel" aria-label="Task tracker">
          <form class="task-form" id="task-form">
            <label class="visually-hidden" for="title">Task title</label>
            <input
              id="title"
              name="title"
              type="text"
              placeholder="What would you like to get done?"
              autocomplete="off"
              aria-describedby="input-hint"
              required
            />
            <button class="add-button" id="add-task" type="submit">
              <span aria-hidden="true">+</span>
              Add task
            </button>
            <span class="visually-hidden" id="input-hint">
              Type a task and press Enter or select Add task.
            </span>
          </form>

          <div class="list-heading">
            <div>
              <h2>Your tasks</h2>
              <p id="task-count" aria-live="polite">0 tasks · 0 done</p>
            </div>
            <span class="heading-sparkle" aria-hidden="true">✦</span>
          </div>

          <nav class="filters" aria-label="Filter tasks">
            <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">
              All
            </button>
            <button class="filter-button" type="button" data-filter="todo" aria-pressed="false">
              To Do
            </button>
            <button class="filter-button" type="button" data-filter="in-progress" aria-pressed="false">
              In Progress
            </button>
            <button class="filter-button" type="button" data-filter="done" aria-pressed="false">
              Done
            </button>
          </nav>

          <ul class="task-list" id="task-list" aria-live="polite" aria-relevant="additions removals"></ul>
        </section>

        <footer class="page-footer">
          <span class="footer-dot" aria-hidden="true"></span>
          Small steps count. Keep going.
        </footer>
      </section>
    </main>
  </body>
</html>
